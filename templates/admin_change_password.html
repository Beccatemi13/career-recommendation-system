<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Change Password</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
href="{{ url_for('static', filename='css/theme.css') }}">

    <style>

        body{
            background:#f4f7fc;
        }

        .card{
            border:none;
            border-radius:20px;
            box-shadow:0 10px 25px rgba(0,0,0,.1);
        }

        .btn-primary{
            background:#23408e;
            border:none;
        }

        .btn-primary:hover{
            background:#1b3373;
        }

        h2{
            color:#23408e;
            font-weight:bold;
        }

    </style>

</head>

<body class="{% if session.get('theme') == 'dark' %}dark-mode{% endif %}">

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="card">

                <div class="card-body p-5">

                    <div class="text-center mb-4">

                        <i class="fas fa-lock fa-4x text-primary"></i>

                        <h2 class="mt-3">

                            Change Password

                        </h2>

                        <p class="text-muted">

                            Update your administrator password.

                        </p>

                    </div>

                    {% with messages = get_flashed_messages(with_categories=true) %}
                    {% if messages %}

                        {% for category, message in messages %}

                        <div class="alert alert-{{ category }}">

                            {{ message }}

                        </div>

                        {% endfor %}

                    {% endif %}
                    {% endwith %}

                    <form method="POST">

                        <div class="mb-3">

                            <label class="form-label">

                                Current Password

                            </label>

                            <input type="password"
                                   name="current_password"
                                   class="form-control"
                                   required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">

                                New Password

                            </label>

                            <input type="password"
                                   name="new_password"
                                   class="form-control"
                                   required>

                        </div>

                        <div class="mb-4">

                            <label class="form-label">

                                Confirm New Password

                            </label>

                            <input type="password"
                                   name="confirm_password"
                                   class="form-control"
                                   required>

                        </div>

                        <div class="d-grid">

                            <button type="submit"
                                    class="btn btn-primary btn-lg">

                                <i class="fas fa-key"></i>

                                Change Password

                            </button>

                        </div>

                    </form>

                    <hr>

                    <div class="text-center">

                        <a href="{{ url_for('admin_dashboard') }}"
                           class="btn btn-outline-secondary">

                            <i class="fas fa-arrow-left"></i>

                            Back to Dashboard

                        </a>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

</body>

</html>
