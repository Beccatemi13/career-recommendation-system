<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Administrator Profile</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

<link rel="stylesheet"
href="{{ url_for('static', filename='css/theme.css') }}">

<style>

body{

    background:#f5f7fb;

}

.profile-card{

    border:none;

    border-radius:20px;

    box-shadow:0 10px 25px rgba(0,0,0,.08);

}

.profile-img{

    width:180px;

    height:180px;

    object-fit:cover;

    border-radius:50%;

    border:6px solid #0d6efd;

}

.info-card{

    border:none;

    border-radius:15px;

    box-shadow:0 4px 15px rgba(0,0,0,.05);

    margin-bottom:15px;

}

.info-title{

    font-size:14px;

    color:#6c757d;

}

.info-value{

    font-size:18px;

    font-weight:bold;

}

.section-title{

    color:#23408e;

    font-weight:bold;

}

</style>

</head>
<body class="{% if session.get('theme') == 'dark' %}dark-mode{% endif %}">

<div class="container py-5">

<div class="card profile-card">

<div class="card-body p-5">

<div class="row">

<!-- LEFT -->

<div class="col-lg-4 text-center">

<img

src="{{ get_profile_picture(student.profile_picture) }}"

class="profile-img">

<h2 class="mt-4">

{{ admin.full_name }}

</h2>

<p class="text-muted">

Administrator

</p>

<hr>

<div class="d-grid gap-2">

<a

href="{{ url_for('admin_settings') }}"

class="btn btn-primary">

<i class="fas fa-cog me-2"></i>

Settings

</a>

<a

href="{{ url_for('admin_dashboard') }}"

class="btn btn-outline-secondary">

<i class="fas fa-arrow-left me-2"></i>

Dashboard

</a>

</div>

</div>

<!-- RIGHT -->

<div class="col-lg-8">

<h2 class="section-title mb-4">

<i class="fas fa-user-shield me-2"></i>

Administrator Profile

</h2>

<div class="row">

<div class="col-md-6">

<div class="card info-card">

<div class="card-body">

<div class="info-title">

Full Name

</div>

<div class="info-value">

{{ admin.full_name }}

</div>

</div>

</div>

</div>

<div class="col-md-6">

<div class="card info-card">

<div class="card-body">

<div class="info-title">

Email

</div>

<div class="info-value">

{{ admin.email }}

</div>

</div>

</div>

</div>

<div class="col-md-6">

<div class="card info-card">

<div class="card-body">

<div class="info-title">

Role

</div>

<div class="info-value">

System Administrator

</div>

</div>

</div>

</div>

<div class="col-md-6">

<div class="card info-card">

<div class="card-body">

<div class="info-title">

Status

</div>

<div class="info-value">

Active

</div>

</div>

</div>

</div>

</div>

</div>

</div>

</div>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
