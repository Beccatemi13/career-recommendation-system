<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Edit Career</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

<link rel="stylesheet"
href="{{ url_for('static', filename='css/admin.css') }}">

<style>

body{
    background:#f5f7fb;
    transition:.3s;
}

.main{
    background:#f5f7fb;
    min-height:100vh;
    padding:30px;
}

.card{
    border:none;
    border-radius:18px;
    box-shadow:0 10px 25px rgba(0,0,0,.08);
}

.card-header{
    background:#23408e;
    color:white;
    border-radius:18px 18px 0 0 !important;
}

.topbar{
    background:white;
    padding:18px 25px;
    border-radius:12px;
    margin-bottom:20px;
    box-shadow:0 5px 15px rgba(0,0,0,.05);
}

.form-control,
.form-select{
    border-radius:10px;
}

textarea{
    min-height:120px;
    resize:vertical;
}

.btn{
    border-radius:10px;
}

/* DARK MODE */

body.dark{
    background:#121212;
    color:white;
}

body.dark .main{
    background:#121212;
}

body.dark .topbar{
    background:#1f1f1f;
    color:white;
}

body.dark .card{
    background:#1f1f1f;
    color:white;
}

body.dark label,
body.dark h4,
body.dark h5{
    color:white;
}

body.dark .form-control,
body.dark .form-select{
    background:#2c2c2c;
    color:white;
    border:1px solid #555;
}

body.dark .form-control:focus,
body.dark .form-select:focus{
    background:#2c2c2c;
    color:white;
    border-color:#4d90fe;
}

body.dark .form-control::placeholder{
    color:#bbb;
}

body.dark .btn-secondary{
    background:#444;
    border-color:#444;
}

</style>

</head>

<body>

<div class="sidebar">

<h3>Career Admin</h3>

<a href="{{ url_for('admin_dashboard') }}">
<i class="fas fa-home"></i>
Dashboard
</a>

<a href="{{ url_for('admin_manage_careers') }}">
<i class="fas fa-briefcase"></i>
Manage Careers
</a>

</div>

<div class="main">

<div class="topbar">

<h4>

<i class="fas fa-edit"></i>

Edit Career

</h4>

</div>

{% with messages=get_flashed_messages(with_categories=true) %}
{% if messages %}

{% for category,message in messages %}

<div class="alert alert-{{ category }} alert-dismissible fade show">

{{ message }}

<button
type="button"
class="btn-close"
data-bs-dismiss="alert">
</button>

</div>

{% endfor %}

{% endif %}
{% endwith %}

<div class="card">

<div class="card-header">

<h5 class="mb-0">

Career Information

</h5>

</div>

<div class="card-body">

<form method="POST">

<div class="row">

<div class="col-md-6 mb-3">

<label class="form-label">

Career Name

</label>

<input
type="text"
class="form-control"
name="career_name"
value="{{ career.career_name }}"
required>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">

Career Field

</label>

<input
type="text"
class="form-control"
name="career_field"
value="{{ career.career_field }}"
required>

</div>

</div>

<div class="mb-3">

<label class="form-label">

Career Description

</label>

<textarea
class="form-control"
name="description"
rows="5"
required>{{ career.description }}</textarea>

</div>

<div class="mb-3">

<label class="form-label">

Why This Career Fits

</label>

<textarea
class="form-control"
name="why_fits"
rows="5">{{ career.why_fits }}</textarea>

</div>

<!-- ================= REQUIRED SKILLS ================= -->

<div class="mb-3">

<label class="form-label">

Required Skills

</label>

<textarea
class="form-control"
name="required_skills"
rows="5">{{ career.required_skills }}</textarea>

</div>


<!-- ================= RECOMMENDED PERSONALITY ================= -->

<div class="mb-3">

<label class="form-label">

Recommended Personality

</label>

<textarea
class="form-control"
name="recommended_personality"
rows="5">{{ career.recommended_personality }}</textarea>

</div>


<!-- ================= ACTIVITIES TO IMPROVE ================= -->

<div class="mb-3">

<label class="form-label">

Activities To Improve

</label>

<textarea
class="form-control"
name="activities_to_improve"
rows="5">{{ career.activities_to_improve }}</textarea>

</div>

<!-- ================= CERTIFICATIONS ================= -->

<div class="mb-3">

<label class="form-label">

Recommended Certifications

</label>

<textarea
class="form-control"
name="certifications"
rows="5">{{ career.certifications }}</textarea>

</div>


<!-- ================= LEARNING PLATFORMS ================= -->

<div class="mb-3">

<label class="form-label">

Learning Platforms

</label>

<textarea
class="form-control"
name="learning_platforms"
rows="5">{{ career.learning_platforms }}</textarea>

</div>


<!-- ================= WORKPLACES ================= -->

<div class="mb-3">

<label class="form-label">

Possible Workplaces

</label>

<textarea
class="form-control"
name="workplaces"
rows="5">{{ career.workplaces }}</textarea>

</div>


<!-- ================= CAREER OUTLOOK ================= -->

<div class="mb-3">

<label class="form-label">

Career Outlook

</label>

<input
type="text"
class="form-control"
name="career_outlook"
value="{{ career.career_outlook }}">

</div>


<!-- ================= MINIMUM QUALIFICATION ================= -->

<div class="mb-3">

<label class="form-label">

Minimum Qualification

</label>

<input
type="text"
class="form-control"
name="minimum_qualification"
value="{{ career.minimum_qualification }}">

</div>


<!-- ================= AVERAGE STUDY YEARS ================= -->

<div class="mb-3">

<label class="form-label">

Average Study Years

</label>

<input
type="text"
class="form-control"
name="average_study_years"
value="{{ career.average_study_years }}">

</div>


<!-- ================= DID YOU KNOW ================= -->

<div class="mb-4">

<label class="form-label">

Did You Know?

</label>

<textarea
class="form-control"
name="did_you_know"
rows="5">{{ career.did_you_know }}</textarea>

</div>


<!-- ================= ACTION BUTTONS ================= -->

<div class="mt-4">

<button
type="submit"
class="btn btn-success">

<i class="fas fa-save"></i>

Save Changes

</button>

<a
href="{{ url_for('admin_manage_careers') }}"
class="btn btn-secondary ms-2">

Cancel

</a>

</div>

</form>

</div>

</div>

</div>

<footer class="text-center text-muted py-4">

Career Recommendation System © 2026

</footer>

<script>

window.onload = function(){

    if(localStorage.getItem("theme") === "dark"){

        document.body.classList.add("dark");

    }

};

</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
