<!DOCTYPE html>
<html>

<head>

<title>Manage Careers</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet"
href="{{ url_for('static', filename='css/theme.css') }}">
</head>

<body class="{% if session.get('theme') == 'dark' %}dark-mode{% endif %}">

<div class="container mt-5">

<h2 class="text-primary">

Career Management

</h2>

<a href="{{ url_for('admin_dashboard') }}" class="btn btn-secondary mb-3">

Back

</a>

<a href="{{ url_for('admin_add_career') }}" class="btn btn-success mb-3">

Add New Career

</a>

<table class="table table-bordered table-hover">

<thead class="table-primary">

<tr>

<th>ID</th>
<th>Career</th>
<th>Salary</th>
<th>Outlook</th>
<th>Action</th>

</tr>

</thead>

<tbody>

{% for career in careers %}

<tr>

<td>{{ loop.index }}</td>
<td>{{ career[1] }}</td>

<td>{{ career[2] }}</td>

<td>{{ career[3] }}</td>

<td>

<td>

<td>

<a href="{{ url_for('admin_edit_career', career_id=career[0]) }}"
class="btn btn-warning btn-sm">

Edit

</a>

<a href="{{ url_for('admin_delete_career', career_id=career[0]) }}"
class="btn btn-danger btn-sm"
onclick="return confirm('Are you sure you want to delete this career?')">

Delete

</a>

</td>

</td>

</a>

<td>

</td>



</a>

</td>

</tr>

{% endfor %}

</tbody>

</table>

</div>

</body>

</html>
