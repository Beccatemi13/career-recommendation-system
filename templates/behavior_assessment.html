<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Behavior Assessment</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

<style>

body{
    background:#f4f7fb;
    transition:.3s;
}

.card{
    max-width:800px;
    margin:auto;
    margin-top:40px;
    border:none;
    border-radius:20px;
    box-shadow:0 10px 25px rgba(0,0,0,.08);
}

.question-box{
    display:none;
}

.question-box.active{
    display:block;
}

.progress{
    height:20px;
    border-radius:20px;
}

.btn-primary{
    background:#23408e;
    border:none;
}

.option{
    padding:15px;
    border:1px solid #ddd;
    border-radius:10px;
    margin-bottom:10px;
    cursor:pointer;
    transition:.2s;
}

.option:hover{
    background:#eef3ff;
}

.navbar{
    background:#23408e;
}

.navbar-brand{
    color:white;
    font-weight:bold;
}

.toggle-btn{
    border:none;
    background:transparent;
    color:white;
    font-size:22px;
}

/* ===========================
   DARK MODE
=========================== */

body.dark{
    background:#121212;
    color:#f5f5f5;
}

body.dark .card{
    background:#1f1f1f;
    color:#ffffff;
}

body.dark h2,
body.dark h3,
body.dark h4,
body.dark h5,
body.dark p,
body.dark label{
    color:#ffffff !important;
}

body.dark hr{
    border-color:#444;
}

body.dark .option{
    background:#2b2b2b;
    border-color:#555;
}

body.dark .option:hover{
    background:#343434;
}

/* Radio buttons */

body.dark .form-check-input,
body.dark input[type="radio"]{
    background:#2b2b2b;
    border:2px solid #bdbdbd;
}

body.dark input[type="radio"]:checked{
    accent-color:#0d6efd;
}

body.dark input[type="radio"]:checked + label{
    color:#4da3ff;
    font-weight:bold;
}

body.dark input[type="radio"]:focus{
    box-shadow:0 0 0 .25rem rgba(13,110,253,.35);
}

</style>

</head>

<body>

<nav class="navbar navbar-dark">

<div class="container">

<span class="navbar-brand">

Career Recommendation System

</span>

<button
class="toggle-btn"
onclick="toggleDarkMode()">

<i class="fas fa-moon"></i>

</button>

</div>

</nav>

<div class="container">

<div class="card p-4">

<h2 class="text-center text-primary">

Behavior Assessment

</h2>

<p class="text-center">

Answer honestly.

</p>

<div class="progress mb-4">

<div
class="progress-bar"
id="progressBar"
style="width:0%;">

0%

</div>

</div>

<form method="POST">

{% for question in questions %}

<input
type="hidden"
name="displayed_questions"
value="{{ question.id }}">

<div class="question-box {% if loop.first %}active{% endif %}">

<h4>

Question {{ loop.index }} of {{ questions|length }}

</h4>

<hr>

<h5>

{{ question.question }}

</h5>

<br>

{% for option in question.options %}

<label class="option w-100">

<input
type="radio"
name="question_{{ question.id }}"
value="{{ option[0] }}"
required>

{{ option[1] }}

</label>

{% endfor %}

<br>

<div class="d-flex justify-content-between">

<button
type="button"
class="btn btn-secondary prevBtn"
{% if loop.first %}style="visibility:hidden"{% endif %}>

Previous

</button>

{% if loop.last %}

<button
type="submit"
class="btn btn-success">

Finish Assessment

</button>

{% else %}

<button
type="button"
class="btn btn-primary nextBtn">

Next

</button>

{% endif %}

</div>

</div>

{% endfor %}

</form>

</div>

</div>

<script>

const questions=document.querySelectorAll(".question-box");
const nextBtns=document.querySelectorAll(".nextBtn");
const prevBtns=document.querySelectorAll(".prevBtn");
const progress=document.getElementById("progressBar");

let current=0;

function updateProgress(){

    let percent=((current+1)/questions.length)*100;

    progress.style.width=percent+"%";

    progress.innerHTML=Math.round(percent)+"%";

}

nextBtns.forEach(btn=>{

    btn.addEventListener("click",()=>{

        let selected=questions[current].querySelector("input[type=radio]:checked");

        if(!selected){

            alert("Please select an option.");

            return;

        }

        questions[current].classList.remove("active");

        current++;

        questions[current].classList.add("active");

        updateProgress();

    });

});

prevBtns.forEach(btn=>{

    btn.addEventListener("click",()=>{

        questions[current].classList.remove("active");

        current--;

        questions[current].classList.add("active");

        updateProgress();

    });

});

updateProgress();

/* ===========================
   DARK MODE
=========================== */

function toggleDarkMode(){

    document.body.classList.toggle("dark");

    if(document.body.classList.contains("dark")){

        localStorage.setItem("theme","dark");

    }else{

        localStorage.setItem("theme","light");

    }

}

window.onload=function(){

    if(localStorage.getItem("theme")=="dark"){

        document.body.classList.add("dark");

    }

}

</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
