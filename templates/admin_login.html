<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Administrator Login</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet"
href="{{ url_for('static', filename='css/theme.css') }}">
<style>

body{
    background:#f5f7fb;
}

.card{
    max-width:450px;
    margin:80px auto;
    border:none;
    border-radius:20px;
    box-shadow:0 10px 25px rgba(0,0,0,.08);
}

</style>

</head>

<body class="{% if session.get('theme') == 'dark' %}dark-mode{% endif %}">

<div class="container">

<div class="card">

<div class="card-body p-5">

<h2 class="text-center text-primary mb-4">

Administrator Login

</h2>

<form method="POST">

<div class="mb-3">

<label class="form-label">

Username

</label>

<input
type="text"
name="username"
class="form-control"
required>

</div>

<div class="mb-4">

<label class="form-label">

Password

</label>

<input
type="password"
name="password"
class="form-control"
required>

</div>

<button
class="btn btn-primary w-100">

Login

</button>

<div class="text-center mt-3">

<a href="{{ url_for('admin_forgot_password') }}">

Forgot Password?

</a>

</div>

</form>

<div class="text-center mt-3">

<a href="{{ url_for('login') }}">

Back to Student Login

</a>

</div>

</div>

</div>

</div>

</body>

</html>
